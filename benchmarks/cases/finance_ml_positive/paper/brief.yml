paper_id: finance_ml_positive
phase_status: release_ready
research_profile: finance_ml
central_claim: The benchmark finance pipeline preserves a reproducible metric-to-paper trace.
so_what: A reviewer can inspect the declared finance protocol and replay the major claim.
novelty: Domain policy validates finance-specific admissibility before paper build.
target_reader: Researchers evaluating reproducible finance ML workflows.
evaluation_protocol:
  temporal_split: train_2021_to_2022__test_2023
  forecast_horizon: one_step_ahead
  leakage_controls: rolling_features_use_past_only_windows
  benchmark: rolling_mean_baseline
  transaction_cost_model: fixed_bps_5
  slippage_model: zero_slippage_synthetic_demo
  data_regime: synthetic_market
baselines:
  - name: rolling_mean_baseline
    kind: deterministic_baseline
    artifact_path: auto/MANIFEST.json
key_questions:
  - Does the finance profile require a temporal protocol and explicit baselines?
expected_source_ids:
  - market_data
planned_evidence:
  - claim_id: main_claim
    required: true
    verification_required: true
    experiment: example
    description: MetricMean supports the finance benchmark claim.
    expected_metrics:
      - MetricMean
    source_ids:
      - market_data
    prohibited_substitutes: []
non_goals:
  - Real-market alpha claims.
