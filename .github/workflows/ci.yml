name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      - name: Install
        run: uv sync
      - name: Run example
        run: make run
      - name: Build assets
        run: make assets-all
      - name: Sync references
        run: make refs-all
      - name: Build provenance ledger
        run: make provenance-all
      - name: Build claim ledger
        run: make claims-all
      - name: Review thread
        run: make review-all
      - name: Build reviewer packet
        run: make packet-all
      - name: Verify claims
        run: make verify-all
      - name: Check
        run: uv run truthweave check --mode ci
