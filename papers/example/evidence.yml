paper_id: example
claims:
  - claim_id: main_claim
    status: supported
    note: The main claim is backed by the generated metric macro and the manifest's source metrics path.
    evidence:
      - kind: variable
        artifact_path: auto/variables.tex
        variable: MetricMean
        source_ids:
          - example_simulated_data
        verification:
          comparison_mode: numeric_tolerance
          expected_value: 0.5101
          tolerance: 0.0001
          rerun_scope: run_and_assets
          rerun_commands:
            - make run
            - uv run truthweave build-paper-assets --paper example
          note: Reproduce the generated metric macro within a tight tolerance.
        note: Metric used directly in the paper text.
      - kind: manifest
        artifact_path: auto/MANIFEST.json
        manifest_pointer: source.metrics_json_path
        source_ids:
          - example_simulated_data
        verification:
          comparison_mode: manifest_entry_present
          rerun_scope: assets_only
          rerun_commands:
            - uv run truthweave build-paper-assets --paper example
          note: Confirm the manifest still exposes the metrics artifact pointer.
        note: Provenance pointer to the concrete metrics artifact used for paper assets.
